<!DOCTYPE html><html lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PDFortuna</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'sans-serif'],
          },
          colors: {
            surface: '#11151e',
            'surface-dim': '#0f131c',
            'surface-bright': '#353943',
            'surface-container-lowest': '#0a0e17',
            'surface-container-low': '#1e2330',
            'surface-container': '#1c2029',
            'surface-container-high': '#272b38',
            'surface-container-highest': '#323746',
            primary: '#6bc4ff',
            'on-primary': '#ffffff',
            'primary-container': '#004a75',
            'on-primary-container': '#ceebff',
            secondary: '#a7ccdf',
            'on-secondary': '#0d3444',
            'secondary-container': '#274a5b',
            'on-secondary-container': '#c3e8fb',
            tertiary: '#b7c7ec',
            'on-tertiary': '#21314f',
            'tertiary-container': '#384766',
            'on-tertiary-container': '#d7e3ff',
            error: '#ffb4ab',
            'on-error': '#690005',
            'error-container': '#93000a',
            'on-error-container': '#ffdad6',
            'on-surface': '#ffffff',
            'on-surface-variant': '#8c94a6',
            outline: '#8b9198',
            'outline-variant': '#41474d',
            inverse: '#e1e2e8',
            'inverse-on-surface': '#0f131c',
            'inverse-primary': '#00639b',
          },
          borderRadius: {
            '8': '8px',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styles">
    body {
      background-color: theme('colors.surface');
      color: theme('colors.on-surface');
    }
    
    .doc-thumbnail {
      object-fit: cover;
      object-position: top center;
    }
    
    /* Scrollbar for filter tags */
    .filter-tags::-webkit-scrollbar {
      display: none;
    }
    .filter-tags {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans bg-surface text-on-surface">
<!-- BEGIN: Top Bar -->
<header class="px-5 pt-12 pb-4 flex items-center sticky top-0 bg-surface z-10 justify-center" data-purpose="top-bar">
<h1 class="text-2xl font-semibold tracking-wide text-on-surface font-bold" style="font-size: 2.5rem;">PDFortuna</h1>
<button aria-label="Settings" class="p-2 text-on-surface-variant hover:text-on-surface transition-colors rounded-full absolute right-5">
<i class="fa-solid fa-gear text-xl"></i>
</button>
</header>
<!-- END: Top Bar -->
<!-- BEGIN: Action Buttons -->
<section class="px-5 py-4 flex justify-around items-center" data-purpose="action-buttons">
<button aria-label="Búsqueda" class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<i class="fa-solid fa-magnifying-glass text-xl"></i>
</button>
<button aria-label="Favoritos" class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<i class="fa-solid fa-heart text-xl"></i>
</button>
<button aria-label="Cámara" class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<i class="fa-solid fa-camera text-xl"></i>
</button>
</section>
<!-- END: Action Buttons -->
<!-- BEGIN: Filter Tags -->
<section class="px-5 py-2 flex items-center gap-3 overflow-x-auto filter-tags" data-purpose="filter-tags">
<button aria-pressed="true" class="px-5 py-2 rounded-full bg-primary text-on-primary font-medium text-sm whitespace-nowrap transition-colors">
      Todos
    </button>
<button aria-pressed="false" class="px-5 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-medium text-sm whitespace-nowrap hover:bg-surface-container-highest transition-colors">
      Recientes
    </button>
<button aria-pressed="false" class="px-5 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-medium text-sm whitespace-nowrap hover:bg-surface-container-highest transition-colors">
      Escáner
    </button>
<div class="flex-grow"></div>
<button aria-label="View options" class="p-2 text-on-surface-variant hover:text-on-surface transition-colors">
<i class="fa-solid fa-list-ul text-lg"></i>
</button>
</section>
<!-- END: Filter Tags -->
<!-- BEGIN: Document Grid -->

<div class="flex justify-between items-center mt-1">
<p class="text-xs text-on-surface-variant">18 Mar • 1 p.</p>

<i class="fa-solid fa-ellipsis-vertical"></i>

<!-- Document Card 4 -->
<article class="bg-surface-container-low rounded-xl overflow-hidden flex flex-col">

<div class="p-3 flex flex-col gap-1">

<!-- Document Card 6 -->
<article class="bg-surface-container-low rounded-xl overflow-hidden flex flex-col">
